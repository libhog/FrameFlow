[package]
name = "frameflow-studio"
version = "0.1.0"
description = "Project-first AI video production studio"
authors = ["FrameFlow"]
edition = "2021"

[lib]
name = "frameflow_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart", "query"] }
open = "5"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
once_cell = "1.21.4"
